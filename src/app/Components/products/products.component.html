<main class="menu-page">
  <div class="menu-page__inner">
    <header class="menu-page__header">
      <h1 class="menu-page__title">{{ 'Products.menuTitle' | translate }}</h1>
      <p class="menu-page__subtitle">{{ 'Products.menuSubtitle' | translate }}</p>
    </header>

    <div class="menu-page__layout" *ngIf="!loading">
      <aside class="menu-sidebar">
        <div class="menu-sidebar__sticky">
          <div class="menu-search">
            <i class="bi bi-search menu-search__icon" aria-hidden="true"></i>
            <input
              type="search"
              class="menu-search__input"
              [ngModel]="searchQuery"
              (ngModelChange)="onSearchChange($event)"
              [placeholder]="searchPlaceholder"
              [attr.aria-label]="searchPlaceholder"
            />
          </div>

          <nav class="menu-tabs" [attr.aria-label]="'Products.categoriesAria' | translate">
            <button
              type="button"
              class="menu-tab"
              *ngFor="let tab of tabs; trackBy: trackByTab"
              [attr.data-key]="tab.key"
              [class.menu-tab--active]="isTabActive(tab.key)"
              [attr.aria-pressed]="isTabActive(tab.key)"
              (click)="setActiveTab(tab.key)"
            >
              {{ tabLabel(tab) }}
            </button>
          </nav>
        </div>
      </aside>

      <div class="menu-content">
        <div class="menu-empty" *ngIf="filteredGroups.length === 0">
          <p>{{ 'Products.noMatch' | translate }}</p>
        </div>

        <section
          class="menu-section"
          *ngFor="let group of filteredGroups; trackBy: trackByGroup"
          [id]="'menu-section-' + group.key"
          [attr.data-cat]="group.key"
          [attr.aria-labelledby]="'cat-' + group.key"
        >
          <h2 class="menu-section__title" [id]="'cat-' + group.key">
            <span class="menu-section__bar" aria-hidden="true"></span>
            {{ groupTitle(group) }}
          </h2>

          <div class="menu-grid">
            <article
              class="product-card"
              *ngFor="let item of group.products; trackBy: trackByProduct"
              [class.product-card--oos]="item.stock <= 0"
              appProductCardTilt
              (click)="gotodetails(item)"
            >
              <button
                type="button"
                class="product-card__wish"
                [class.product-card__wish--active]="item.isFavorite"
                (click)="toggleFavourite(item, $event)"
                [attr.aria-label]="
                  item.isFavorite
                    ? ('cart.removeFromWishlist' | translate)
                    : ('cart.addToWishlist' | translate)
                "
                [attr.aria-pressed]="item.isFavorite"
              >
                <i
                  class="fa-heart"
                  [ngClass]="item.isFavorite ? 'fa-solid' : 'fa-regular'"
                ></i>
              </button>

              <span class="product-card__badge" *ngIf="item._badge">
                {{ item._badge }}
              </span>

              <span class="product-card__badge product-card__badge--oos" *ngIf="item.stock <= 0">
                {{ 'outOfStock' | translate }}
              </span>

              <div class="product-card__media">
                <img
                  [src]="item.imagePath"
                  [alt]="productName(item)"
                  loading="lazy"
                  decoding="async"
                />
              </div>

              <h3 class="product-card__name">{{ productName(item) }}</h3>

              <div class="product-card__footer">
                <app-animated-price
                  [value]="item._price"
                  [currency]="currencyLabel(item)"
                ></app-animated-price>

                <button
                  type="button"
                  class="product-card__quick"
                  *ngIf="item.stock > 0"
                  (click)="quickAdd(item, $event)"
                  [attr.aria-label]="('Products.quickAdd' | translate) + ' ' + productName(item)"
                >
                  <span class="product-card__quick-icon" aria-hidden="true">
                    <i class="bi bi-plus-lg"></i>
                  </span>
                  <span class="product-card__quick-label">{{ 'Products.quickAdd' | translate }}</span>
                </button>

                <span
                  class="product-card__quick-spacer"
                  *ngIf="item.stock <= 0"
                  aria-hidden="true"
                ></span>
              </div>
            </article>
          </div>
        </section>
      </div>
    </div>

    <div class="menu-loading" *ngIf="loading">
      <span class="menu-loading__spinner" aria-hidden="true"></span>
      <p>{{ 'Products.loading' | translate }}</p>
    </div>
  </div>

  <button
    type="button"
    class="scroll-to-top"
    *ngIf="showScrollButton"
    (click)="scrollToTop()"
    aria-label="Scroll to top"
  >
    <i class="fa-solid fa-arrow-up"></i>
  </button>
</main>
