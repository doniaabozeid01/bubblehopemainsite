<section
  class="beverages"
  [attr.dir]="(languageService.languageChanged$ | async) === 'ar' ? 'rtl' : 'ltr'"
>
  <header class="beverages__header">
    <p class="beverages__eyebrow">{{ 'home.categoriesEyebrow' | translate }}</p>
    <h2 class="beverages__title">{{ 'home.categoriesHeading' | translate }}</h2>
    <p class="beverages__slogan">{{ 'home.categoriesSlogan' | translate }}</p>
  </header>

  <div class="beverages__track position-relative">
    <owl-carousel-o
      *ngIf="categories?.length"
      #catCarousel
      class="beverages-carousel"
      [options]="catOptions"
      (drag)="dragging = true"
      (dragged)="dragging = false"
    >
      <ng-template carouselSlide *ngFor="let cat of categories; trackBy: trackById">
        <div class="bev-slide">
          <article
            class="bev-card"
            [style.--accent]="cat.bgColor"
            (pointerdown)="onPtrDown($event)"
            (pointermove)="onPtrMove($event)"
            (pointerup)="onPtrUp()"
            (pointercancel)="onPtrCancel()"
            (pointerleave)="onPtrCancel()"
            (click)="onCardClick(cat.id, $event)"
          >
            <div class="bev-card__media">
              <img
                [src]="cat.imageUrl"
                [alt]="(languageService.languageChanged$ | async) === 'ar' ? cat.name_ar : cat.name"
                class="bev-card__img"
                draggable="false"
              />
            </div>

            <div class="bev-card__panel">
              <div class="bev-card__body">
                <div class="bev-card__copy">
                  <h3 class="bev-card__name">
                    {{
                      (languageService.languageChanged$ | async) === 'ar'
                        ? cat.name_ar
                        : cat.name
                    }}
                  </h3>
                  <p class="bev-card__hint">{{ 'home.categoriesCardHint' | translate }}</p>
                </div>

                <button
                  type="button"
                  class="bev-card__cta"
                  [attr.aria-label]="'home.categoriesCardHint' | translate"
                  (click)="onCardClick(cat.id, $event); $event.stopPropagation()"
                >
                  <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </article>
        </div>
      </ng-template>
    </owl-carousel-o>
  </div>
</section>
