<div
  class="premium-hero"
  [attr.dir]="(languageService.languageChanged$ | async) === 'ar' ? 'rtl' : 'ltr'"
  [attr.aria-label]="'home.heroAdsAria' | translate"
>
  <div class="premium-hero__atmosphere" aria-hidden="true">
    <span class="premium-hero__blob premium-hero__blob--peach"></span>
    <span class="premium-hero__blob premium-hero__blob--mint"></span>
    <span class="premium-hero__blob premium-hero__blob--orange"></span>
    <span class="premium-hero__grain"></span>
  </div>

  <div #track class="premium-hero__track" (scroll)="onScroll()">
    <article
      class="hero-slide"
      *ngFor="let slide of slides; trackBy: trackById; let i = index"
      [attr.data-index]="i"
      [attr.data-kind]="slide.kind"
      [class.hero-slide--ad]="slide.kind === 'ad'"
    >
      <!-- Brand / premium slides -->
      <ng-container *ngIf="slide.kind === 'brand'">
        <div class="hero-slide__glass">
          <div class="hero-slide__copy">
            <span class="hero-badge">{{ slide.badgeKey! | translate }}</span>
            <p class="hero-brand">{{ slide.brandKey! | translate }}</p>
            <h1 class="hero-title">
              <span class="hero-title__word">{{ slide.titleKey! | translate }}</span>
              <span class="hero-title__word hero-title__word--accent">{{
                slide.accentKey! | translate
              }}</span>
            </h1>
            <p class="hero-sub">{{ slide.subtitleKey! | translate }}</p>
            <a
              *ngIf="slide.ctaHref?.startsWith('http')"
              class="hero-cta"
              [href]="slide.ctaHref"
              target="_blank"
              rel="noopener"
            >
              {{ slide.ctaKey! | translate }}
            </a>
            <a
              *ngIf="slide.ctaHref && !slide.ctaHref.startsWith('http')"
              class="hero-cta"
              [routerLink]="slide.ctaHref"
            >
              {{ slide.ctaKey! | translate }}
            </a>
          </div>

          <div class="hero-visual">
            <div class="hero-visual__glow" aria-hidden="true"></div>
            <img
              class="hero-visual__img"
              [src]="slide.image"
              [alt]="slide.imageAlt"
              draggable="false"
            />
            <span
              class="hero-float"
              *ngFor="let f of floatItems"
              [style.top]="f.top"
              [style.left]="f.left"
              [style.width.px]="f.size"
              [style.height.px]="f.size"
              [style.background]="f.color"
              [style.animation-duration.s]="f.dur"
              aria-hidden="true"
            ></span>
          </div>
        </div>
      </ng-container>

      <!-- API ad banners -->
      <ng-container *ngIf="slide.kind === 'ad'">
        <div class="hero-ad">
          <img [src]="slide.image" [alt]="slide.imageAlt" draggable="false" />
        </div>
      </ng-container>
    </article>
  </div>

  <div class="premium-hero__dots" *ngIf="slides.length > 1" role="tablist">
    <button
      type="button"
      class="premium-hero__dot"
      *ngFor="let i of dotIndexes"
      [class.is-active]="activeIndex === i"
      [attr.aria-label]="'Slide ' + (i + 1)"
      (click)="goTo(i)"
    ></button>
  </div>

  <div class="premium-hero__scoop" aria-hidden="true"></div>
</div>
