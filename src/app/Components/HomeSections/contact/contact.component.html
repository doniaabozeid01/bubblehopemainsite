<section class="contact-shell">
  <div class="contact-section">
    <div class="contact-inner">
      <div class="text-center">
        <p class="contact-eyebrow">{{ 'home.contactus' | translate }}</p>
        <h2 class="contact-title">{{ 'home.contactHeading' | translate }}</h2>
        <p class="contact-subtitle">
          {{ 'home.contactslogan' | translate }}
        </p>
      </div>

      <div class="contact-box mx-auto">
        <form [formGroup]="contactForm" (ngSubmit)="submit()">
          <div class="row g-3 mb-3">
            <div class="col-12 col-md-6">
              <input
                formControlName="fullName"
                type="text"
                class="form-control border-blue"
                [placeholder]="'auth.FullName' | translate"
                autocomplete="name"
              />
            </div>
            <div class="col-12 col-md-6">
              <input
                formControlName="email"
                type="email"
                class="form-control border-blue"
                [placeholder]="'auth.email' | translate"
                autocomplete="email"
                inputmode="email"
              />
            </div>
          </div>

          <div class="mb-3">
            <textarea
              formControlName="message"
              class="form-control border-blue"
              rows="5"
              [placeholder]="'home.contactMsg' | translate"
            ></textarea>
          </div>

          <div class="contact-actions">
            <button
              type="submit"
              class="contact-submit btn-with-loader"
              [disabled]="contactForm.invalid || isLoading"
            >
              <span *ngIf="!isLoading">{{ 'home.send' | translate }}</span>
              <app-brand-loader *ngIf="isLoading" size="sm" label="Loading..."></app-brand-loader>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
