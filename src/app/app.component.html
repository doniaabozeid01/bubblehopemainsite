<div class="branch-selector-overlay" *ngIf="showBranchModal">
  <div class="branch-selector-card">
    <div class="logo-section">
      <img src="../assets/Untitled-2.png" alt="Bubble Hope" class="bubble-logo" />
    </div>

    <h2 class="hero-title">
      {{ 'branchModal.titleLine1' | translate }}
      <span class="highlight-alt">{{ 'branchModal.titleLine1Alt' | translate }}</span>
      {{ 'branchModal.titleLine1End' | translate }}
      <br>
      <span class="highlight">
        {{ 'branchModal.titleLine2' | translate }} <i class="fa-solid fa-face-smile-beam"></i>!
      </span>
    </h2>

    <p class="hero-subtitle">{{ 'branchModal.subtitle' | translate }}</p>

<div class="branch-list">
  <button *ngFor="let branch of branches"
          (click)="selectBranch(branch.id)"
          class="branch-btn">
    <span class="icon text-orange"><i class="fa-solid fa-location-dot"></i></span>
    {{ translate.currentLang === 'ar' ? branch.name_ar : branch.name }}
  </button>

  <p *ngIf="branches.length === 0" style="text-align:center; color:#666;">
    Loading branches...
  </p>
</div>
  </div>
</div>

<app-preloader [show]="!!(isLoading$ | async)"></app-preloader>
    <router-outlet></router-outlet>
