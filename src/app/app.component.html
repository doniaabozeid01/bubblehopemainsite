<!-- لسه بيجيب الحالة من الباك -->
<ng-container *ngIf="isSiteEnabled !== null">

    <!-- ❌ الموقع مقفول -->
    <app-pending-site *ngIf="!isSiteEnabled"></app-pending-site>

    <!-- ✅ الموقع مفتوح -->
    <ng-container *ngIf="isSiteEnabled">
        <app-preloader [show]="!!(isLoading$ | async)"></app-preloader>
        <router-outlet></router-outlet>
    </ng-container>

</ng-container>

<!-- Branch selector modal -->
<div
  class="branch-selector-overlay"
  *ngIf="showBranchModal"
  (click)="closeBranchModal()"
>
  <div class="branch-selector-card" (click)="$event.stopPropagation()">
    <div class="logo-section">
      <img src="assets/Group 73.png" alt="Bubble Hope" />
    </div>

    <h2 class="hero-title">
      <span class="highlight">
        {{ 'branchModal.titleLine1' | translate }}
        {{ 'branchModal.titleLine1Alt' | translate }}
      </span>
      {{ 'branchModal.titleLine1End' | translate }}
      <br />
      {{ 'branchModal.titleLine2' | translate }}
    </h2>

    <p class="hero-subtitle">{{ 'branchModal.subtitle' | translate }}</p>

    <div class="branch-list">
      <button
        type="button"
        class="branch-btn"
        *ngFor="let branch of branches"
        (click)="selectBranch(branch.id)"
      >
        <span class="icon">
          <i class="fa-solid fa-location-dot"></i>
        </span>
        <span>
          {{ translate.currentLang === 'ar' ? branch.name_ar : branch.name }}
        </span>
      </button>
    </div>
  </div>
</div>
